# Render Blueprint — backend API + PostgreSQL.
# Render → New → Blueprint → pick this repo. The frontend is deployed on Vercel.

databases:
  - name: university-portal-db
    plan: free
    databaseName: attendance_db
    user: portal

services:
  - type: web
    name: university-portal-api
    runtime: node
    plan: free
    rootDir: apps/backend
    # postinstall runs `prisma generate`
    buildCommand: npm install
    # Free instances have no pre-deploy step, so the schema sync runs on start
    startCommand: npm run deploy:db && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: university-portal-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false   # prompted on first deploy — your Vercel URL
      - key: ALLOW_VERCEL_PREVIEWS
        value: "false"
